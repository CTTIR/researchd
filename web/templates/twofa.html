<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-factor</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="wrap narrow">
<h1>Two-factor authentication</h1>
<p class="muted">Enter the 6-digit code from your authenticator app, or a recovery code.</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/2fa">
  <label>Code</label><input name="code" inputmode="text" autocomplete="one-time-code" required autofocus>
  <button type="submit">Verify</button>
</form></main></body></html>
